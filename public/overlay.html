<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>While You Were AFK · OBS overlay</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 24px; background: transparent; color: #f4f0e9; font-family: system-ui, sans-serif; }
      .card { width: min(440px, 100%); background: #202437f2; border: 1px solid #ffffff20; border-radius: 18px; padding: 28px; box-shadow: 0 10px 40px #0002; }
      .eyebrow { color: #e9a682; font-size: 10px; letter-spacing: 2px; }
      h1 { font-size: 32px; letter-spacing: -1.5px; line-height: 1.05; margin: 18px 0 20px; }
      h1 span { color: #e7794c; }
      section { margin-top: 22px; }
      h2 { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: #c7b9dc; margin-bottom: 8px; }
      p { font-size: 14px; line-height: 1.65; margin: 0; overflow-wrap: anywhere; }
      time { color: #989aaf; font-size: 10px; margin-left: 8px; }
      footer { border-top: 1px solid #ffffff20; margin-top: 24px; padding-top: 18px; color: #b6adc7; font-size: 12px; }
      code { color: #f0b28e; }
      #status { color: #b8a9c5; font-size: 10px; margin-top: 12px; }
    </style>
  </head>
  <body>
    <article class="card"><div class="eyebrow" id="eyebrow">THE STORY SO FAR</div><h1><span>↶</span> While you<br>were AFK.</h1><div id="moments"><p>Waiting for approved moments…</p></div><footer>Just arrived? Type <code>!catchup</code> in chat.</footer><div id="status" role="status"></div></article>
    <script type="module" src="/overlay.js"></script>
  </body>
</html>
